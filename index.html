<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asad's Songify</title>
<link rel="icon" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#fff;
background:radial-gradient(1200px 700px at 8% 0%,#3a1450 0%,transparent 60%),radial-gradient(1000px 600px at 100% 100%,#0e4a4f 0%,transparent 60%),#0b0713;background-attachment:fixed}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}
.eq{display:flex;align-items:flex-end;gap:4px;height:44px}
.eq i{width:7px;border-radius:4px;background:linear-gradient(#ffb300,#ff3d71)}
.eq i:nth-child(1){height:50%}.eq i:nth-child(2){height:90%}.eq i:nth-child(3){height:65%}.eq i:nth-child(4){height:100%;background:linear-gradient(#00d1a0,#1ea5d6)}
h1{margin:0;font-size:38px;font-weight:900;line-height:1}
h1 b{background:linear-gradient(90deg,#ff3d71,#ffb300,#00d1a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:4px 0 0;opacity:.7;font-size:14px}
.pill{border:1px solid #00d1a0;color:#00e5b4;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600}
main{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:0 28px 40px;max-width:1500px;margin:auto}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px;align-self:start}
h3{margin:22px 0 10px;font-size:18px;font-weight:800}
h3:first-child{margin-top:0}
.drop{display:flex;align-items:center;gap:14px;padding:18px;border:2px dashed rgba(255,255,255,.22);border-radius:16px;margin-bottom:12px;cursor:pointer;background:rgba(255,255,255,.03)}
.drop:hover{border-color:#00d1a0}
.drop span{font-size:26px}.drop em{font-style:normal;opacity:.9;word-break:break-all}
#title{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{border-color:transparent;background:linear-gradient(90deg,#ff3d71,#ffb300 60%,#00d1a0);color:#1a0b1f;font-weight:700}
section{min-width:0}
#cv{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:70vh;border-radius:22px;background:#000;border:1px solid rgba(255,255,255,.12)}
.bar{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
#play{width:56px;height:56px;border-radius:50%;border:0;font-size:22px;cursor:pointer;background:linear-gradient(135deg,#ff3d71,#ffb300,#00d1a0);color:#1a0b1f}
#seek{flex:1;accent-color:#ff3d71}
#time{opacity:.8;min-width:44px;text-align:right}
.actions{display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.cta{border:0;border-radius:999px;padding:18px 38px;font-size:20px;font-weight:900;cursor:pointer;color:#1a0b1f;background:linear-gradient(90deg,#ff3d71,#ffb300,#00d1a0)}
.cta.stop{background:#ff3d71;color:#fff}
#msg{opacity:.85}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3d71,#ffb300,#00d1a0)}
@media(max-width:900px){main{grid-template-columns:1fr;padding:0 14px 30px}header{padding:16px 14px}h1{font-size:30px}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="eq"><i></i><i></i><i></i><i></i></div>
    <div><h1>Asad's <b>Songify</b></h1><p>Drop a song. Get a video.</p></div></div>
  <span class="pill">Free · No watermark</span>
</header>
<main>
  <aside class="panel">
    <h3>Your files</h3>
    <label class="drop"><input type="file" id="fa" accept="audio/*" hidden><span>🎵</span><em id="an">Choose MP3 / audio</em></label>
    <label class="drop"><input type="file" id="fi" accept="image/*" hidden><span>🖼️</span><em id="in">Choose cover image</em></label>
    <input id="title" placeholder="Optional title / lyrics line">
    <h3>Style</h3><div class="chips" id="styles" data-key="style"></div>
    <h3>Shape</h3><div class="chips" id="shapes" data-key="shape"></div>
    <h3>Quality</h3><div class="chips" id="quals" data-key="q"></div>
  </aside>
  <section>
    <canvas id="cv"></canvas>
    <div class="bar"><button id="play">▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="time">0:00</span></div>
    <div class="actions"><button id="exp" class="cta">Export 1080p MP4</button><span id="msg">Add a song to begin.</span></div>
    <div class="prog"><i id="pg"></i></div>
  </section>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d',{alpha:false});
const bgc=document.createElement('canvas'),ccv=document.createElement('canvas');
const N=64,freq=new Uint8Array(512),td=new Uint8Array(1024).fill(128),bands=new Float32Array(N);
let bass=0,W=1920,H=1080,u=1080,cx=960,cy=540;
const st={style:'rickshaw',shape:'wide',q:1080};
let img=null,ac,an,dest,hasAudio=false,exporting=false,rec,chunks=[],cancelled=false,EXT='mp4',MIME='';
const au=new Audio();au.preload='auto';

const STYLES=[['bars','📊 Bars'],['circle','⭕ Circle'],['wave','🌊 Wave'],['rickshaw','🛺 Rickshaw art'],['mirror','🪞 Mirror'],['line','〰️ Line'],['spectrum','🏔️ Spectrum'],['radial','☀️ Radial'],['cords','🎸 Cords'],['nebula','🌌 Nebula'],['dots','🔵 Dots'],['rings','🎯 Rings'],['equal','🎚️ Equalizer'],['none','🚫 None']];
const SHAPES=[['wide','16:9 Wide'],['reels','9:16 Reels'],['square','1:1 Square']];
const QUALS=[[720,'720p'],[1080,'1080p']];

/* ---------- UI ---------- */
function build(el,items){items.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.dataset.v=v;
  b.onclick=()=>{if(exporting)return;const k=el.dataset.key;st[k]=k==='q'?+v:v;if(k!=='style')size();mark();label();};el.appendChild(b);});}
function mark(){document.querySelectorAll('.chips').forEach(el=>{const k=el.dataset.key;el.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.v===String(st[k])));});}
function label(){$('#exp').textContent=exporting?'■ Cancel export':'Export '+st.q+'p '+(pickMime().ext.toUpperCase());}
const msg=t=>$('#msg').textContent=t;
build($('#styles'),STYLES);build($('#shapes'),SHAPES);build($('#quals'),QUALS);

/* ---------- size + cached background ---------- */
function size(){const q=st.q;
  if(st.shape==='wide'){H=q;W=Math.round(q*16/9);}else if(st.shape==='reels'){W=q;H=Math.round(q*16/9);}else{W=H=q;}
  W-=W%2;H-=H%2;cv.width=W;cv.height=H;u=Math.min(W,H);cx=W/2;cy=H/2;buildBg();}
function buildBg(){
  bgc.width=W;bgc.height=H;const b=bgc.getContext('2d');
  if(img){const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;b.drawImage(img,(W-w)/2,(H-h)/2,w,h);b.fillStyle='rgba(8,4,16,.55)';b.fillRect(0,0,W,H);}
  else{const g=b.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a1050');g.addColorStop(.6,'#4a1428');g.addColorStop(1,'#0e3a40');b.fillStyle=g;b.fillRect(0,0,W,H);}
  ccv.width=ccv.height=512;const k=ccv.getContext('2d');k.clearRect(0,0,512,512);k.save();k.beginPath();k.arc(256,256,256,0,7);k.clip();
  if(img){const r=Math.max(512/img.width,512/img.height),w=img.width*r,h=img.height*r;k.drawImage(img,(512-w)/2,(512-h)/2,w,h);}
  else{k.fillStyle='#2a1546';k.fillRect(0,0,512,512);k.fillStyle='rgba(255,255,255,.35)';k.font='260px system-ui';k.textAlign='center';k.textBaseline='middle';k.fillText('♪',256,276);}
  k.restore();}

/* ---------- audio ---------- */
function initAudio(){if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.7;
  const s=ac.createMediaElementSource(au);s.connect(an);an.connect(ac.destination);dest=ac.createMediaStreamDestination();an.connect(dest);}
function pickMime(){const L=[['video/mp4;codecs=avc1.640028,mp4a.40.2','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm;codecs=vp8,opus','webm'],['video/webm','webm']];
  if(window.MediaRecorder){for(const [m,e] of L)if(MediaRecorder.isTypeSupported(m))return{mime:m,ext:e};}return{mime:'',ext:'webm'};}
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0');};

$('#fa').onchange=e=>{const f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);$('#an').textContent=f.name;hasAudio=true;msg('Ready. Play ba Export dao.');$('#play').textContent='▶';};
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;buildBg();};i.src=URL.createObjectURL(f);$('#in').textContent=f.name;};
$('#play').onclick=async()=>{if(exporting||!hasAudio){if(!hasAudio)msg('Age ekta MP3 choose koro.');return;}
  initAudio();await ac.resume();if(au.paused){au.play();$('#play').textContent='❚❚';}else{au.pause();$('#play').textContent='▶';}};
$('#seek').oninput=e=>{if(!exporting&&au.duration)au.currentTime=e.target.value/1000*au.duration;};
au.ontimeupdate=()=>{if(au.duration){$('#seek').value=au.currentTime/au.duration*1000;$('#time').textContent=fmt(au.currentTime);
  if(exporting){const p=au.currentTime/au.duration*100;$('#pg').style.width=p+'%';msg('Exporting '+(p|0)+'% — ei tab ta khola rakho');}}};
au.onended=()=>{$('#play').textContent='▶';if(exporting)setTimeout(()=>rec&&rec.state!=='inactive'&&rec.stop(),500);};

/* ---------- export ---------- */
$('#exp').onclick=async()=>{
  if(exporting){cancelled=true;au.pause();if(rec&&rec.state!=='inactive')rec.stop();return;}
  if(!hasAudio){msg('Age ekta MP3 choose koro.');return;}
  if(window.VideoEncoder&&window.AudioEncoder&&window.Mp4Muxer&&await fastExport())return;
  const pm=pickMime();if(!pm.mime){msg('Ei browser MediaRecorder support kore na. Chrome/Edge use koro.');return;}
  MIME=pm.mime;EXT=pm.ext;initAudio();await ac.resume();
  au.pause();au.currentTime=0;cancelled=false;chunks=[];
  const ms=new MediaStream([...cv.captureStream(30).getVideoTracks(),dest.stream.getAudioTracks()[0]]);
  rec=new MediaRecorder(ms,{mimeType:MIME,videoBitsPerSecond:st.q>=1080?10e6:6e6,audioBitsPerSecond:192000});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{exporting=false;$('#exp').classList.remove('stop');$('#play').textContent='▶';label();
    if(cancelled){msg('Export cancel hoyeche.');$('#pg').style.width='0';return;}
    const url=URL.createObjectURL(new Blob(chunks,{type:MIME}));const a=document.createElement('a');a.href=url;a.download='songify-'+st.q+'p.'+EXT;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);$('#pg').style.width='100%';msg('Done ✅ Video download hoyeche.');};
  exporting=true;$('#exp').classList.add('stop');label();rec.start(1000);await au.play();$('#play').textContent='❚❚';msg('Exporting… real-time e hoy, tab khola rakho.');};

/* ---------- FAST export (offline, real-time er cheye onek druto) ---------- */
let fastBusy=false;
function fft(re,im){const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=i+k+len/2,xr=re[b]*cr-im[b]*ci,xi=re[b]*ci+im[b]*cr;
      re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;}}}}
async function fastExport(){
  const cfg={codec:'avc1.640028',width:W,height:H,bitrate:st.q>=1080?10e6:6e6,framerate:30};
  try{const s=await VideoEncoder.isConfigSupported(cfg);if(!s.supported)return false;}catch(e){return false;}
  exporting=true;fastBusy=true;cancelled=false;$('#exp').classList.add('stop');label();au.pause();$('#play').textContent='▶';
  const tick=()=>new Promise(r=>setTimeout(r,0));
  let ve,ae;
  try{
    msg('Audio decode hocche…');await tick();
    const ac2=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await ac2.decodeAudioData(await (await fetch(au.src)).arrayBuffer());ac2.close();
    const sr=ab.sampleRate,len=ab.length,FPS=30,total=Math.ceil(ab.duration*FPS);
    const c0=ab.getChannelData(0),c1=ab.numberOfChannels>1?ab.getChannelData(1):c0;
    const mono=new Float32Array(len);for(let i=0;i<len;i++)mono[i]=(c0[i]+c1[i])*.5;
    const hann=new Float32Array(1024),re=new Float32Array(1024),im=new Float32Array(1024),sm=new Float32Array(512);
    for(let i=0;i<1024;i++)hann[i]=.5-.5*Math.cos(2*Math.PI*i/1023);
    const target=new Mp4Muxer.ArrayBufferTarget();
    const muxer=new Mp4Muxer.Muxer({target,video:{codec:'avc',width:W,height:H},audio:{codec:'aac',numberOfChannels:2,sampleRate:sr},fastStart:'in-memory'});
    let err=null;
    ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});ve.configure(cfg);
    ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>err=e});
    ae.configure({codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,bitrate:192000});
    let ap=0;
    for(let i=0;i<total&&!cancelled&&!err;i++){
      const t=i/FPS,pos=Math.max(0,Math.min(len-1024,Math.floor(t*sr)-512));
      for(let k=0;k<1024;k++){const s=mono[pos+k]||0;re[k]=s*hann[k];im[k]=0;td[k]=Math.max(0,Math.min(255,128+s*128));}
      fft(re,im);
      for(let k=0;k<512;k++){sm[k]=.7*sm[k]+.3*Math.hypot(re[k],im[k])/1024;freq[k]=Math.max(0,Math.min(255,(20*Math.log10(sm[k]+1e-9)+100)/70*255));}
      analyse(t,true);draw(t);
      const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      ve.encode(vf,{keyFrame:i%60===0});vf.close();
      const end=Math.min(len,Math.floor((i+1)*sr/FPS));
      if(end>ap){const n=end-ap,d=new Float32Array(n*2);d.set(c0.subarray(ap,end),0);d.set(c1.subarray(ap,end),n);
        const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(ap/sr*1e6),data:d});ae.encode(ad);ad.close();ap=end;}
      while(ve.encodeQueueSize>6)await tick();
      if(i%4===0){const p=i/total*100;$('#pg').style.width=p+'%';msg('Fast export '+(p|0)+'% — tab khola rakho');await tick();}
    }
    if(err)throw err;
    if(cancelled){try{ve.close();ae.close();}catch(e){}msg('Export cancel hoyeche.');$('#pg').style.width='0';}
    else{msg('Finalizing…');await ve.flush();await ae.flush();muxer.finalize();
      const url=URL.createObjectURL(new Blob([target.buffer],{type:'video/mp4'}));const a=document.createElement('a');a.href=url;a.download='songify-'+st.q+'p.mp4';
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('#pg').style.width='100%';msg('Done ✅ MP4 download hoyeche.');}
  }catch(e){console.error(e);msg('Fast export fail: '+(e.message||e));$('#pg').style.width='0';}
  exporting=false;fastBusy=false;$('#exp').classList.remove('stop');label();
  return true;
}

/* ---------- analysis ---------- */
function analyse(t,force){
  const playing=force||(ac&&!au.paused);
  if(playing&&!force){an.getByteFrequencyData(freq);an.getByteTimeDomainData(td);}
  else for(let i=0;i<1024;i+=2)td[i]=128+Math.sin(i*.03+t*3)*16;
  for(let i=0;i<N;i++){let v;
    if(playing){const lo=Math.floor(Math.pow(i/N,2)*380)+1,hi=Math.max(lo+1,Math.floor(Math.pow((i+1)/N,2)*380)+1);let s=0;for(let j=lo;j<hi;j++)s+=freq[j];
      v=Math.min(1,s/(hi-lo)/255*(1+i/N*.9));v=Math.pow(v,1.2);}
    else v=.07+.05*Math.sin(t*2+i*.45);
    bands[i]+=(v-bands[i])*(v>bands[i]?.55:.14);}
  let b=0;for(let i=0;i<6;i++)b+=bands[i];bass=b/6;}

/* ---------- drawing helpers ---------- */
const col=(i,n,t,a)=>'hsla('+(((i/n*320+t*25)%360)|0)+',90%,60%,'+a+')';
const PAL=['#ff3d71','#ffb300','#7c3aed','#00d1a0','#1ea5d6','#ffd21f'];
function rect(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill();}
function cover(c,r){const rr=r*(1+bass*.07);c.drawImage(ccv,cx-rr,cy-rr,rr*2,rr*2);}
function curve(c,p){c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;c.quadraticCurveTo(p[i][0],p[i][1],mx,my);}c.lineTo(p[p.length-1][0],p[p.length-1][1]);}
const P=Array.from({length:140},()=>({a:Math.random()*6.283,r:.15+Math.random()*.85,s:(Math.random()*.4+.1)*(Math.random()<.5?-1:1),z:Math.random()*.6+.4,h:Math.random()*120+260,b:Math.floor(Math.random()*40)}));

const V={
bars(c,t){const gap=W*.004,bw=(W*.86-gap*(N-1))/N,x0=W*.07,base=H*.88,mh=H*.5;
  for(let i=0;i<N;i++){const h=Math.max(6,bands[i]*mh);c.fillStyle=col(i,N,t,.95);rect(c,x0+i*(bw+gap),base-h,bw,h,bw/2);}},
circle(c,t){const r=u*.2;cover(c,r);c.lineCap='round';c.lineWidth=u*.008;const n=128;
  for(let i=0;i<n;i++){const k=i<64?i:127-i,v=bands[k],a=i/n*6.2832-1.5708+t*.1,in_=r*(1+bass*.07)+u*.02,out=in_+v*u*.22+3;
    c.strokeStyle=col(i,n,t,.95);c.beginPath();c.moveTo(cx+Math.cos(a)*in_,cy+Math.sin(a)*in_);c.lineTo(cx+Math.cos(a)*out,cy+Math.sin(a)*out);c.stroke();}},
wave(c,t){c.lineJoin='round';const cols=['#ff3d71','#ffb300','#00d1a0'];
  for(let l=0;l<3;l++){c.beginPath();const amp=H*.34*(1-l*.22)*(.5+bass);
    for(let i=0;i<=200;i++){const x=i/200*W,v=(td[Math.floor(i/200*1000)]-128)/128,y=cy+v*amp+Math.sin(i*.08+t*2+l)*H*.012*l;i?c.lineTo(x,y):c.moveTo(x,y);}
    c.lineWidth=u*(.013-l*.003);c.strokeStyle=cols[l];c.globalAlpha=1-l*.25;c.stroke();}c.globalAlpha=1;},
rickshaw(c,t){const r=u*.19;cover(c,r*.95);c.lineWidth=u*.012;c.strokeStyle='#ffb300';c.beginPath();c.arc(cx,cy,r,0,6.2832);c.stroke();
  const n=24;for(let i=0;i<n;i++){const a=i/n*6.2832+t*.25,v=bands[Math.floor(i/n*40)],len=u*.05+v*u*.13,d=r+len*.6+u*.015;
    c.save();c.translate(cx+Math.cos(a)*d,cy+Math.sin(a)*d);c.rotate(a);c.fillStyle=PAL[i%6];c.beginPath();c.ellipse(0,0,len*.6,u*.022+v*u*.01,0,0,6.2832);c.fill();c.restore();}
  for(let i=0;i<48;i++){const a=i/48*6.2832-t*.15,v=bands[i%N],rad=u*.42+v*u*.03;c.fillStyle=PAL[i%6];c.beginPath();c.arc(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,u*.005+v*u*.009,0,6.2832);c.fill();}},
mirror(c,t){const bw=W*.8/N,x0=W*.1;for(let i=0;i<N;i++){const k=Math.min(N-1,Math.abs(i-31.5)*2|0),h=Math.max(4,bands[k]*H*.32);
  c.fillStyle=col(k,N,t,.95);rect(c,x0+i*bw,cy-h,bw*.72,h*2,bw*.3);}},
line(c,t){const pts=[];for(let i=0;i<N;i++)pts.push([W*.06+i/(N-1)*W*.88,H*.75-bands[i]*H*.45]);
  const g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#ff3d71');g.addColorStop(.5,'#ffb300');g.addColorStop(1,'#00d1a0');
  c.lineWidth=u*.011;c.lineCap='round';c.strokeStyle=g;c.beginPath();curve(c,pts);c.stroke();
  c.globalAlpha=.3;c.beginPath();curve(c,pts.map(p=>[p[0],H*.75+(H*.75-p[1])*.5]));c.stroke();c.globalAlpha=1;},
spectrum(c,t){const pts=[];for(let i=0;i<N;i++)pts.push([i/(N-1)*W,H*.92-bands[i]*H*.6]);
  const g=c.createLinearGradient(0,H*.3,0,H);g.addColorStop(0,'rgba(255,61,113,.9)');g.addColorStop(.5,'rgba(255,179,0,.7)');g.addColorStop(1,'rgba(0,209,160,.5)');
  c.fillStyle=g;c.beginPath();c.moveTo(0,H);c.lineTo(0,pts[0][1]);curve(c,pts);c.lineTo(W,H);c.closePath();c.fill();},
radial(c,t){const in_=u*.15*(1+bass*.15);c.fillStyle=col(0,1,t,.25+bass*.4);c.beginPath();c.arc(cx,cy,in_*.95,0,6.2832);c.fill();cover(c,u*.12);
  c.lineCap='round';c.lineWidth=u*.0045;const n=180;for(let i=0;i<n;i++){const k=Math.min(N-1,(i<90?i:179-i)*N/90|0),v=bands[k],a=i/n*6.2832+t*.15,o=in_+u*.02+v*u*.3+2;
    c.strokeStyle=col(i,n,t,.9);c.beginPath();c.moveTo(cx+Math.cos(a)*(in_+u*.02),cy+Math.sin(a)*(in_+u*.02));c.lineTo(cx+Math.cos(a)*o,cy+Math.sin(a)*o);c.stroke();}},
cords(c,t){c.lineCap='round';for(let s=0;s<8;s++){const y0=H*(.2+.6*s/7),amp=Math.max(.01,bands[s*7])*H*.1;c.lineWidth=u*.0045+bands[s*7]*u*.005;c.strokeStyle=col(s,8,t,.95);c.beginPath();
  for(let i=0;i<=80;i++){const x=i/80*W,y=y0+Math.sin(i/80*Math.PI*(2+s%3)+t*(2+s*.3))*amp*Math.sin(i/80*Math.PI);i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}},
nebula(c,t){c.globalCompositeOperation='lighter';for(let i=0;i<P.length;i++){const p=P[i],a=p.a+t*p.s*(1+bass*2),rad=p.r*u*(.3+bass*.35),x=cx+Math.cos(a)*rad*1.6,y=cy+Math.sin(a)*rad*.95,s=p.z*u*(.004+bands[p.b]*.022);
  c.fillStyle='hsla('+((p.h+t*10)%360|0)+',90%,60%,.35)';c.beginPath();c.arc(x,y,s,0,6.2832);c.fill();c.fillStyle='hsla('+((p.h+t*10)%360|0)+',90%,60%,.08)';c.beginPath();c.arc(x,y,s*2.6,0,6.2832);c.fill();}
  c.globalCompositeOperation='source-over';},
dots(c,t){const cols=32,rows=14,cw=W*.84/cols,rc=[];for(let r=0;r<rows;r++)rc.push(col(r,rows,t,.95));
  for(let i=0;i<cols;i++){const on=Math.round(bands[i*2]*rows);for(let r=0;r<on;r++){c.fillStyle=rc[r];c.beginPath();c.arc(W*.08+(i+.5)*cw,H*.9-r*(H*.58/rows),cw*.3,0,6.2832);c.fill();}}},
rings(c,t){cover(c,u*.1);c.lineWidth=u*.008;for(let k=0;k<6;k++){c.strokeStyle=col(k,6,t,.9);c.beginPath();c.arc(cx,cy,u*(.14+k*.06)+bands[k*9]*u*.07,0,6.2832);c.stroke();}},
equal(c,t){const cols=32,rows=16,cw=W*.84/cols,rh=H*.6/rows,rc=[];for(let r=0;r<rows;r++)rc.push(r<9?'#00d1a0':r<13?'#ffb300':'#ff3d71');
  for(let i=0;i<cols;i++){const on=Math.round(bands[i*2]*rows);for(let r=0;r<on;r++){c.fillStyle=rc[r];c.fillRect(W*.08+i*cw+cw*.1,H*.9-(r+1)*rh+rh*.12,cw*.8,rh*.76);}}},
none(){}
};

function drawTitle(c){const tx=$('#title').value.trim();if(!tx)return;let fs=u*.05;c.font='800 '+fs+'px system-ui,"Segoe UI",Arial';const w=c.measureText(tx).width;
  if(w>W*.9){fs*=W*.9/w;c.font='800 '+fs+'px system-ui,"Segoe UI",Arial';}c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(0,0,0,.45)';c.fillText(tx,cx+2,H*.09+2);c.fillStyle='#fff';c.fillText(tx,cx,H*.09);}

function draw(t){const c=ctx,s=1+bass*.035;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.drawImage(bgc,-W*(s-1)/2,-H*(s-1)/2,W*s,H*s);(V[st.style]||V.none)(c,t);drawTitle(c);}

/* ---------- loop (export e 30fps cap = PC hang hoy na) ---------- */
let last=0;
function loop(now){requestAnimationFrame(loop);if(fastBusy)return;if(now-last<(exporting?30:15))return;last=now;analyse(now/1000);draw(now/1000);}

size();mark();label();requestAnimationFrame(loop);
})();
</script>
